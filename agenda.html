<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Agenda da Equipa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
        }

        /* ── Ecrã de PIN ───────────────────────────────── */
        #pin-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
            padding: 24px;
        }

        .pin-card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .pin-card .logo {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .pin-card h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a3a5c;
            margin-bottom: 6px;
        }

        .pin-card p {
            font-size: 0.88rem;
            color: #666;
            margin-bottom: 24px;
        }

        .pin-input {
            width: 100%;
            padding: 14px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
            letter-spacing: 6px;
            outline: none;
            transition: border-color 0.2s;
            appearance: textfield;
        }

        .pin-input:focus {
            border-color: #2d6a9f;
        }

        .pin-btn {
            width: 100%;
            margin-top: 14px;
            padding: 13px;
            background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .pin-btn:hover {
            opacity: 0.88;
        }

        .pin-error {
            margin-top: 12px;
            color: #c0392b;
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 20px;
        }

        /* ── Agenda ─────────────────────────────────────── */
        #agenda-screen {
            display: none;
        }

        .agenda-header {
            background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
            color: #fff;
            padding: 24px 20px 18px;
            text-align: center;
            position: relative;
        }

        .btn-voltar {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .equipa-logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px;
            margin-bottom: 8px;
        }

        .agenda-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .equipa-meta {
            font-size: 0.82rem;
            opacity: 0.85;
        }

        .agenda-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px 12px 48px;
        }

        .agenda-dia {
            margin: 20px 0 8px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #2d6a9f;
            border-bottom: 2px solid #2d6a9f;
            padding-bottom: 4px;
        }

        .agenda-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #fff;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
            border-left: 4px solid #ccc;
        }

        .agenda-item.tipo-jogo {
            border-left-color: #e67e22;
        }

        .agenda-item.tipo-refeicao {
            border-left-color: #27ae60;
        }

        .agenda-item.tipo-lazer {
            border-left-color: #8e44ad;
        }

        .agenda-item.tipo-cerimonia {
            border-left-color: #2980b9;
        }

        .agenda-item.tipo-outro {
            border-left-color: #95a5a6;
        }

        .agenda-hora {
            min-width: 46px;
            font-size: 1rem;
            font-weight: 700;
            color: #1a3a5c;
            padding-top: 2px;
        }

        .agenda-icone {
            font-size: 1.35rem;
            padding-top: 1px;
        }

        .agenda-info {
            flex: 1;
        }

        .agenda-titulo {
            font-weight: 600;
            font-size: 0.92rem;
            color: #1a1a2e;
        }

        .agenda-subtitulo {
            font-size: 0.8rem;
            color: #666;
            margin-top: 2px;
        }

        .jogo-placar {
            margin-top: 4px;
            font-size: 0.85rem;
        }

        .jogo-placar .score {
            font-size: 1.05rem;
            font-weight: 700;
            color: #e67e22;
        }

        .badge-estado {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .badge-em-jogo {
            background: #fff3cd;
            color: #856404;
        }

        .badge-agendado {
            background: #e3f2fd;
            color: #1565c0;
        }

        .badge-terminado {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-cancelado {
            background: #fce4ec;
            color: #c62828;
        }

        .agenda-msg {
            text-align: center;
            color: #888;
            padding: 40px 20px;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <!-- Ecrã de PIN -->
    <div id="pin-screen">
        <div class="pin-card">
            <div class="logo">🏀</div>
            <h1>Agenda da Equipa</h1>
            <p>Introduza o PIN fornecido pela organização</p>
            <input type="number" id="pin-input" class="pin-input" placeholder="0000" min="1">
            <button class="pin-btn" id="btn-pin">Ver Agenda</button>
            <div id="pin-error" class="pin-error"></div>
        </div>
    </div>

    <!-- Ecrã da Agenda -->
    <div id="agenda-screen">
        <div class="agenda-header" id="equipa-header">
            <button class="btn-voltar" id="btn-voltar">← Voltar</button>
            <div>A carregar...</div>
        </div>
        <div class="agenda-container">
            <div id="agenda-lista"></div>
        </div>
    </div>

    <script src="js/config.js?v=1"></script>
    <script src="js/agenda.js?v=2"></script>
</body>

</html>
