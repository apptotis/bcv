<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opiniões - Torneio Eurocidade</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="index.html"
                style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: white;">
                <img src="Logo_bcv.jpg" alt="Logo BCV" class="site-logo">
                <h1>Torneio Eurocidade</h1>
            </a>
        </div>
        <button class="menu-toggle" aria-label="Abrir Menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Visão Geral</a></li>
                <li><a href="equipas.html">Equipas</a></li>
                <li><a href="jogos.html">Jogos</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="patrocinadores.html">Patrocinadores</a></li>
                <li><a href="onde-comer.html">Onde Comer</a></li>
                <li><a href="onde-dormir.html">Onde Dormir</a></li>
                <li><a href="opinioes.html" class="active">Opiniões</a></li>
                <li><a href="contactos.html">Contactos</a></li>
                <li><a href="admin.html">Admins</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-content">
        <section id="opinioes" class="page-section active" style="display: block;">
            <h2>Deixe a Sua Opinião</h2>

            <!-- Formulário -->
            <div class="opiniao-form-container">
                <form id="opiniao-form">
                    <div class="form-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email (opcional)</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-group">
                        <label for="opiniao">A Sua Opinião *</label>
                        <textarea id="opiniao" name="opiniao" rows="5" required
                            placeholder="Partilhe a sua experiência sobre o torneio..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Enviar Opinião</button>
                </form>
            </div>

            <!-- Lista de Opiniões -->
            <h2 style="margin-top: 40px;">Opiniões dos Participantes</h2>
            <div id="opinioes-list">
                <p class="loading">A carregar opiniões...</p>
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
