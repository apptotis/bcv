<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Galeria - Torneio Eurocidade</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a148c">
    <link rel="apple-touch-icon" href="Logo_bcv.jpg">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4/3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            padding: 15px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .empty-gallery {
            text-align: center;
            padding: 50px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border: 2px dashed rgba(255,255,255,0.1);
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: white;">
                <img src="Logo_bcv.jpg" alt="Logo BCV" class="site-logo">
                <h1>Torneio Eurocidade</h1>
            </a>
        </div>
        <button class="menu-toggle" aria-label="Abrir Menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Visão Geral</a></li>
                <li><a href="equipas.html">Equipas Participantes</a></li>
                <li><a href="jogos.html">Resultados dos Jogos</a></li>
                <li><a href="galeria.html" class="active">Galeria de Fotos</a></li>
                <li><a href="informacao.html">Informa&#231;&#227;o e Regulamentos</a></li>
                <li><a href="patrocinadores.html">Patrocinadores</a></li>
                <li><a href="agenda.html">Agenda Tecnica</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-content">
        <section id="galeria" class="page-section active">
            <h2>Galeria de Fotos</h2>
            
            <!-- Grid de Fotos -->
            <div class="gallery-grid" id="photos-container">
                <!-- Por enquanto mostramos uma mensagem ou placeholders -->
                <div class="empty-gallery">
                    <p>As fotos do torneio estarão disponíveis em breve.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="js/config.js?v=mobile20"></script>
    <script src="js/script.js?v=opt1"></script>
</body>

</html>
