<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Galeria - Torneio Eurocidade</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a148c">
    <link rel="apple-touch-icon" href="Logo_bcv.jpg">
    <link rel="stylesheet" href="css/style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .album-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16/10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            cursor: pointer;
            background: #222;
        }

        .album-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .album-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s ease;
        }

        .album-card:hover img {
            filter: brightness(0.7);
        }

        .album-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 20px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .album-info h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .album-count {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 5px;
            display: block;
        }

        /* ─── FULLSCREEN SLIDER MODAL ─── */
        .slider-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            color: white;
        }

        .slider-overlay.active {
            display: flex;
        }

        .slider-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .btn-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 5px 15px;
        }

        .slider-container {
            flex: 1;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .slider-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari and Opera */
        }

        .slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .slide img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 20px 15px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
            transition: background 0.3s;
            z-index: 11;
        }

        .slider-nav:hover {
            background: rgba(255,255,255,0.2);
        }

        .slider-nav.prev { left: 0; border-radius: 0 5px 5px 0; }
        .slider-nav.next { right: 0; border-radius: 5px 0 0 5px; }

        .slider-footer {
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.7;
            background: rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .slider-nav { display: none; } /* Use swipe on mobile */
        }
    </style>
</head>

<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: white;">
                <img src="Logo_bcv.jpg" alt="Logo BCV" class="site-logo">
                <h1>Torneio Eurocidade</h1>
            </a>
        </div>
        <button class="menu-toggle" aria-label="Abrir Menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Visão Geral</a></li>
                <li><a href="equipas.html">Equipas Participantes</a></li>
                <li><a href="jogos.html">Resultados dos Jogos</a></li>
                <li><a href="galeria.html" class="active">Galeria de Fotos</a></li>
                <li><a href="informacao.html">Informa&#231;&#227;o e Regulamentos</a></li>
                <li><a href="patrocinadores.html">Patrocinadores</a></li>
                <li><a href="agenda.html">Agenda Tecnica</a></li>
            </ul>
        </nav>
    </header>

    <main id="app-content">
        <section id="galeria" class="page-section active">
            <h2>Galeria de Fotos</h2>
            
            <!-- Grid de Álbuns -->
            <div class="album-grid" id="albums-container">
                <p class="loading">A carregar álbuns...</p>
            </div>
        </section>
    </main>

    <!-- Overlay do Slider -->
    <div id="slider-overlay" class="slider-overlay">
        <div class="slider-header">
            <h3 id="slider-album-title">Álbum</h3>
            <button class="btn-close" onclick="closeGallery()">&times;</button>
        </div>
        
        <button class="slider-nav prev" id="btn-prev">❮</button>
        <div class="slider-container" id="slider-container">
            <!-- Fotos inseridas dinamicamente -->
        </div>
        <button class="slider-nav next" id="btn-next">❯</button>

        <div class="slider-footer" id="slider-footer">
            1 de X
        </div>
    </div>

    <script src="js/config.js?v=mobile20"></script>
    <script src="js/script.js?v=opt1"></script>
</body>

</html>
